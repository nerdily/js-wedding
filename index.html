<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>J &amp; S — Bar Harbor, September 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&family=Luxurious+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --sand:#edaf8d;
    --sage:#6fad8b;
    --navy:#2c4e69;
    --paper:#fcfbfb;
    --sage-dark:#5a9676;
    --ink:#2c4e69;
    --muted:#6a7a88;
    --line:#e7e3dd;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-weight:300;
    color:var(--ink);
    background:var(--paper);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;letter-spacing:.5px;}
  a{color:var(--sage-dark);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s;}
  a:hover{border-color:var(--sage-dark);}

  /* ---------- Password gate ---------- */
  #gate{
    position:fixed;inset:0;z-index:1000;
    display:flex;align-items:center;justify-content:center;
    /* Jordan Pond scenery, softened so the card stays readable */
    background:
      linear-gradient(160deg,rgba(252,251,251,.86) 0%,rgba(244,239,231,.80) 55%,rgba(234,223,210,.84) 100%),
      url("images/jordan-pond.jpg") center/cover no-repeat;
    padding:24px;
  }
  .gate-card{
    width:100%;max-width:420px;text-align:center;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(6px);
    border:1px solid var(--line);
    border-radius:18px;
    padding:48px 36px;
    box-shadow:0 20px 50px -24px rgba(44,78,105,.35);
  }
  .gate-card .mono{font-family:'Cormorant Garamond',serif;font-size:.95rem;letter-spacing:4px;text-transform:uppercase;color:var(--sand);}
  .gate-card h1{font-size:3.4rem;margin:.2em 0 .1em;line-height:1;}
  .gate-card .sub{font-size:.8rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:32px;}
  .gate-card label{display:block;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .gate-card input{
    width:100%;padding:14px 16px;font-size:1rem;font-family:inherit;
    border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
    text-align:center;letter-spacing:1px;
  }
  .gate-card input:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(111,173,139,.18);}
  .gate-card button{
    width:100%;margin-top:16px;padding:14px;font-family:'Montserrat',sans-serif;
    font-size:.78rem;letter-spacing:2px;text-transform:uppercase;font-weight:500;
    color:#fff;background:var(--sage);border:none;border-radius:10px;cursor:pointer;transition:background .2s;
  }
  .gate-card button:hover{background:var(--sage-dark);}
  .gate-card button:disabled{opacity:.6;cursor:default;}
  .gate-error{min-height:1.2em;margin-top:14px;font-size:.8rem;color:#b5654a;letter-spacing:.5px;}

  /* ---------- Navigation ---------- */
  header.nav{
    position:sticky;top:0;z-index:50;
    background:rgba(252,251,251,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:1000px;margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
  }
  .nav-brand{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--navy);white-space:nowrap;}
  .nav-links{display:flex;flex-wrap:wrap;gap:6px 4px;justify-content:flex-end;}
  .nav-links a{
    font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;font-weight:400;
    color:var(--muted);padding:6px 10px;border-radius:6px;border-bottom:none;
  }
  .nav-links a:hover{color:var(--navy);background:rgba(111,173,139,.12);}
  .nav-toggle{display:none;}

  /* ---------- Hero ---------- */
  .hero{
    text-align:center;padding:130px 24px 110px;
    /* The couple at the Cadillac Mountain summit — the ceremony spot.
       Light wash keeps the script lettering legible over the photo. */
    background:
      linear-gradient(180deg,rgba(252,251,251,.62) 0%,rgba(252,251,251,.42) 50%,rgba(252,251,251,.86) 100%),
      url("images/summit-couple.jpg") center 28%/cover no-repeat;
    border-bottom:1px solid var(--line);
  }
  .hero .mono{font-family:'Cormorant Garamond',serif;letter-spacing:8px;text-transform:uppercase;color:#b5764a;font-size:1.25rem;text-shadow:0 1px 10px rgba(252,251,251,.9);}
  .hero h1{font-family:'Luxurious Script',cursive;font-size:clamp(3.4rem,11vw,6.5rem);margin:.1em 0;color:var(--navy);line-height:1.15;text-shadow:0 2px 22px rgba(252,251,251,.92),0 1px 2px rgba(252,251,251,.95);}
  .hero .amp{font-family:'Luxurious Script',cursive;font-style:normal;font-weight:400;color:var(--sand);font-size:1.15em;line-height:1;}
  .hero .where{font-size:.85rem;letter-spacing:3px;text-transform:uppercase;color:var(--navy);margin-top:18px;text-shadow:0 1px 8px rgba(252,251,251,.9);}
  .hero .date{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--sage-dark);margin-top:6px;text-shadow:0 1px 8px rgba(252,251,251,.9);}

  /* ---------- Sections ---------- */
  main{max-width:900px;margin:0 auto;padding:0 24px;}
  section{padding:64px 0;border-bottom:1px solid var(--line);scroll-margin-top:80px;}
  section:last-child{border-bottom:none;}
  section h2{font-size:2.4rem;color:var(--navy);margin:0 0 6px;text-align:center;}
  .section-rule{width:54px;height:2px;background:var(--sand);margin:0 auto 36px;border:none;}
  section h3{font-size:1.5rem;color:var(--sage-dark);margin:34px 0 4px;}
  section h4{font-family:'Montserrat',sans-serif;font-weight:600;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;color:var(--sand);margin:26px 0 10px;}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:22px 24px;margin:16px 0;box-shadow:0 10px 30px -22px rgba(44,78,105,.4);
  }
  .place-name{font-family:'Cormorant Garamond',serif;font-size:1.35rem;color:var(--navy);}
  .addr{font-size:.9rem;color:var(--muted);margin:4px 0 2px;white-space:pre-line;}
  .note{font-size:.9rem;color:var(--ink);font-style:italic;}
  .badge{display:inline-block;font-size:.66rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--sage-dark);background:rgba(111,173,139,.14);padding:3px 9px;border-radius:20px;margin-top:8px;}
  .maps{display:inline-flex;gap:0;align-items:center;font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;margin-top:12px;}
  .maps a{padding:5px 12px;border:1px solid var(--line);border-radius:20px;color:var(--sage-dark);background:#fff;border-bottom:1px solid var(--line);}
  .maps a:first-child{margin-right:8px;}
  .maps a:hover{background:var(--sage);color:#fff;border-color:var(--sage);}

  /* ---------- Photo banners (in-section) ---------- */
  .banner{
    position:relative;margin:0 0 32px;border-radius:16px;overflow:hidden;
    box-shadow:0 16px 38px -24px rgba(44,78,105,.55);
  }
  .banner img{display:block;width:100%;height:240px;object-fit:cover;}
  /* Taller frame + lower crop for banners where faces sit low in the photo */
  .banner.feature img{height:430px;object-position:center 64%;}
  .banner figcaption{
    position:absolute;left:0;right:0;bottom:0;
    font-family:'Cormorant Garamond',serif;font-size:1.05rem;letter-spacing:3px;text-transform:uppercase;
    color:#fff;padding:30px 20px 14px;
    background:linear-gradient(180deg,rgba(44,78,105,0) 0%,rgba(44,78,105,.6) 100%);
  }
  .footer-photo{max-width:300px;margin:0 auto 30px;}
  .footer-photo img{width:100%;border-radius:16px;display:block;box-shadow:0 16px 40px -22px rgba(44,78,105,.55);}

  /* Agenda timeline */
  .day{margin:14px 0;}
  .day-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:12px;}
  .day-title em{color:var(--sand);font-style:italic;}
  ul.agenda{list-style:none;padding:0;margin:0;}
  ul.agenda li{padding:8px 0 8px 22px;position:relative;font-size:.98rem;}
  ul.agenda li::before{content:"";position:absolute;left:0;top:16px;width:7px;height:7px;border-radius:50%;background:var(--sage);}
  ul.agenda li .t{font-weight:500;color:var(--navy);}
  ul.agenda li .soon{font-size:.78rem;letter-spacing:1px;text-transform:uppercase;color:var(--sand);font-style:italic;}
  ul.agenda .sub{margin:6px 0 2px;padding-left:6px;}
  ul.agenda .sub li{padding:4px 0 4px 20px;font-size:.94rem;}
  ul.agenda .sub li::before{top:13px;width:5px;height:5px;background:var(--sand);}
  ul.agenda .maps{margin-top:6px;}

  ul.plain{list-style:none;padding:0;margin:8px 0;}
  ul.plain li{padding:7px 0 7px 22px;position:relative;}
  ul.plain li::before{content:"";position:absolute;left:0;top:15px;width:6px;height:6px;border-radius:50%;background:var(--sand);}

  .lead{text-align:center;color:var(--muted);max-width:620px;margin:0 auto 14px;font-size:1rem;}

  footer{text-align:center;padding:48px 24px 60px;color:var(--muted);font-size:.8rem;letter-spacing:1px;}
  footer .names{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--navy);letter-spacing:2px;}

  .hidden{display:none !important;}

  @media (max-width:720px){
    .hero{padding:96px 24px 80px;}
    .banner img{height:180px;}
    .banner.feature img{height:300px;}
    .nav-inner{flex-wrap:wrap;}
    .nav-toggle{
      display:block;background:none;border:1px solid var(--line);border-radius:8px;
      color:var(--navy);font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;
      padding:8px 12px;cursor:pointer;
    }
    .nav-links{display:none;width:100%;flex-direction:column;align-items:stretch;justify-content:flex-start;}
    .nav-links.open{display:flex;}
    .nav-links a{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);border-radius:0;}
    .nav-links a:last-child{border-bottom:none;}
  }
</style>
</head>
<body>

  <!-- ============ PASSWORD GATE ============ -->
  <div id="gate">
    <div class="gate-card">
      <div class="mono">We're getting married</div>
      <h1>J <span style="color:var(--sand);font-style:italic;">&amp;</span> S</h1>
      <div class="sub">Bar Harbor, Maine</div>
      <form id="gate-form" autocomplete="off">
        <label for="pw">Guest password</label>
        <input id="pw" name="pw" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <button id="gate-btn" type="submit">Enter</button>
        <div class="gate-error" id="gate-error" role="alert"></div>
      </form>
    </div>
  </div>

  <!-- ============ SITE (hidden until unlocked) ============ -->
  <div id="site" class="hidden">
    <header class="nav">
      <div class="nav-inner">
        <span class="nav-brand">J &amp; S</span>
        <button class="nav-toggle" id="nav-toggle" aria-label="Menu">Menu</button>
        <nav class="nav-links" id="nav-links">
          <a href="#info">We Need Info</a>
          <a href="#agenda">Agenda</a>
          <a href="#hotel">Hotel</a>
          <a href="#pack">What to Pack</a>
          <a href="#restaurants">Restaurants</a>
          <a href="#acadia">Acadia</a>
          <a href="#transportation">Transportation</a>
        </nav>
      </div>
    </header>

    <div class="hero">
      <div class="mono">Wedding weekend extravaganza</div>
      <h1>Jared <span class="amp">&amp;</span> Stephanie</h1>
      <div class="where">Cadillac Mountain &middot; Acadia National Park</div>
      <div class="date">Saturday, September 26, 2026</div>
    </div>

    <main id="content"></main>

    <footer>
      <div class="footer-photo"><img src="images/lighthouse.jpg" alt="Bass Harbor Head Lighthouse, Acadia" loading="lazy"></div>
      <div class="names">J &amp; S</div>
      <div style="margin-top:8px;">Bar Harbor, Maine &middot; September 2026</div>
    </footer>
  </div>

  function b64ToBuf(b64){
    const bin=atob(b64);const buf=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
    return buf;
  }

  async function decryptContent(password){
    const p=window.__PAYLOAD__;
    const salt=b64ToBuf(p.salt), iv=b64ToBuf(p.iv), ct=b64ToBuf(p.ct);
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:salt,iterations:p.iter,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    return new TextDecoder().decode(plain);
  }

  const form=document.getElementById('gate-form');
  const pw=document.getElementById('pw');
  const btn=document.getElementById('gate-btn');
  const err=document.getElementById('gate-error');

  function unlock(html){
    document.getElementById('content').innerHTML=html;
    document.getElementById('site').classList.remove('hidden');
    const gate=document.getElementById('gate');
    gate.style.transition='opacity .5s';gate.style.opacity='0';
    setTimeout(()=>gate.remove(),500);
    try{sessionStorage.setItem('wedding_pw',pw.value);}catch(e){}
  }

  async function attempt(password,silent){
    try{
      const html=await decryptContent(password);
      unlock(html);
    }catch(e){
      if(!silent){
        err.textContent='That password didn’t work. Please try again.';
        pw.value='';pw.focus();
        btn.disabled=false;btn.textContent='Enter';
      }
    }
  }

  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    err.textContent='';
    btn.disabled=true;btn.textContent='Unlocking…';
    attempt(pw.value,false);
  });

  // remember within the tab session
  try{
    const saved=sessionStorage.getItem('wedding_pw');
    if(saved)attempt(saved,true);
  }catch(e){}

  // mobile nav toggle
  document.getElementById('nav-toggle').addEventListener('click',function(){
    document.getElementById('nav-links').classList.toggle('open');
  });
  document.getElementById('nav-links').addEventListener('click',function(e){
    if(e.target.tagName==='A')document.getElementById('nav-links').classList.remove('open');
  });
</script>
